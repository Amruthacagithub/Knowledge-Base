name: Knowledge Base CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devops-improvements
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # ── Stage 1: Code Linting & Static Analysis ──
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Python Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 KB-main/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 KB-main/backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: KB-main/frontend/package-lock.json

      - name: Run Frontend Lint
        working-directory: KB-main/frontend
        run: |
          npm ci
          npm run lint --if-present

  # ── Stage 2: Unit & Integration Testing ──
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r KB-main/requirements.txt

      - name: Execute Pytest Suite with Coverage
        run: |
          python -m pytest KB-main/tests/ -m "not integration" -v --cov=backend

  test-frontend:
    name: Frontend Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: KB-main/frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: KB-main/frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: KB-main/frontend
        run: npm run test

      - name: Verify Production SPA Build
        working-directory: KB-main/frontend
        run: npm run build

  # ── Stage 3: Security & Vulnerability Scanning ──
  security-scan:
    name: Dependency & Secret Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@d710430a6722f083d3b36b8339ff66b32f22ee55
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # ── Stage 4: Container Build & Image Security Scan ──
  docker-build:
    name: Multi-Stage Container Build & Scan
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Container Image
        run: |
          docker build -f docker/Dockerfile.backend -t kb-backend:${{ github.sha }} .

      - name: Build Frontend Container Image
        run: |
          docker build -f docker/Dockerfile.frontend -t kb-frontend:${{ github.sha }} .

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@d710430a6722f083d3b36b8339ff66b32f22ee55
        with:
          image-ref: "kb-backend:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ── Stage 5: Kubernetes Manifest Dry-Run Validation ──
  k8s-validate:
    name: Kubernetes Manifests Dry-Run Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate Kustomize Output
        run: |
          kubectl kustomize k8s/ > rendered_manifests.yaml
          cat rendered_manifests.yaml | grep "kind: Deployment"

