apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-config
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: configuration
data:
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ekip"
  POSTGRES_USER: "ekip"
  QDRANT_HOST: "qdrant-svc"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "enterprise_docs"
  CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1:80,http://localhost:30080"
  ENVIRONMENT: "kubernetes-production"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
