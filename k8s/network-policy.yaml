# ==============================================================================
# Kubernetes NetworkPolicies: Least-Privilege Network Isolation
# Enforces defense-in-depth network boundaries between tiers.
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: knowledge-base
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-isolation-policy
  namespace: knowledge-base
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic from Frontend pods
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8000
    # Allow incoming Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastore-isolation-policy
  namespace: knowledge-base
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["postgres", "qdrant"]
  policyTypes:
    - Ingress
  ingress:
    # Datastores only accept traffic from authorized Backend API pods
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
