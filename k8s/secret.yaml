# ==============================================================================
# Kubernetes Secret: Knowledge Base Platform (LOCAL DEVELOPMENT DEFAULTS)
#
# WARNING: This file is committed ONLY for local-developer convenience so that
# `kubectl apply -k k8s/` works out of the box. It contains obvious placeholder
# values and MUST NOT be used in production or committed with real credentials.
#
# Real secrets must be injected at runtime and never hardcoded here or in Docker
# build arguments. To create a real secret in your cluster, use the template and
# the kubectl create-secret workflow documented in k8s/secret.template.yaml:
#
#   kubectl create secret generic kb-secret -n knowledge-base \
#     --from-literal=POSTGRES_PASSWORD=<real_db_password> \
#     --from-literal=JWT_SECRET=<real_jwt_signing_key> \
#     --from-literal=GEMINI_API_KEY=<real_gemini_api_key>
#
# See docs/devops/SECURITY.md for the credential rotation runbook.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: kb-secret
  namespace: knowledge-base
  labels:
    app.kubernetes.io/name: knowledge-base
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Local development placeholder — replace before any non-local deployment.
  POSTGRES_PASSWORD: "change-me-local-dev-only"
  # Local development placeholder — replace with a strong random signing key.
  JWT_SECRET: "change-me-local-dev-only"
  # Set via kubectl or your CI/CD secret store; empty disables LLM synthesis.
  GEMINI_API_KEY: ""
